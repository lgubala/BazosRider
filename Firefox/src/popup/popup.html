<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <!-- Without this, Firefox for Android draws the popup at desktop scale. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bazoš Rider</title>
  <link rel="stylesheet" href="../ui/base.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1><img src="../../icons/icon-48.png" alt="">Bazoš Rider</h1>
    <!-- V okolí / Celé Slovensko: filters every list, Strážcovia included. -->
    <div id="scope" class="tabs scope">
      <button class="tab" type="button" data-scope="near"></button>
      <button class="tab" type="button" data-scope="all" data-i18n="scope_all"></button>
    </div>
    <!-- The dashboard's few numbers; only in a whole tab. -->
    <span id="stats" class="stats"></span>
    <span id="count" class="hint"></span>
    <!-- The same page in a whole tab: the dashboard. Hidden there. -->
    <button id="open-full" type="button" data-i18n="popup_full" data-i18n-title="popup_full_title"></button>
    <button id="toggle-view" type="button"></button>
  </header>

  <!-- The lists: one card per module in src/lists/, built by popup.js. -->
  <!-- Background reading: when it last ran, and a button to run it now. -->
  <div id="reader-line" class="reader hint"></div>

  <main id="view-lists">
    <div id="cards" class="grid"></div>
  </main>

  <!-- Settings, in the popup itself. Built by settings.js. -->
  <div id="view-settings" class="settings" hidden>
    <section class="card">
      <h2 data-i18n="options_filters"></h2>
      <p class="hint" data-i18n="options_filters_hint"></p>
      <!-- One block per module in src/filters/. -->
      <div id="filters"></div>
    </section>

    <section class="card">
      <h2 data-i18n="options_auto"></h2>
      <p class="hint" data-i18n="options_auto_hint"></p>
      <label class="line"><input id="auto-enabled" type="checkbox"> <span data-i18n="options_auto_enabled"></span></label>
      <div class="modes">
        <label class="mode"><input type="radio" name="auto-mode" value="strict">
          <span><b data-i18n="options_mode_strict"></b><br><span class="hint" data-i18n="options_mode_strict_hint"></span></span></label>
        <label class="mode"><input type="radio" name="auto-mode" value="loose">
          <span><b data-i18n="options_mode_loose"></b><br><span class="hint" data-i18n="options_mode_loose_hint"></span></span></label>
      </div>
      <label class="line"><span data-i18n="options_auto_share"></span>
        <input id="auto-share" type="number" min="1" max="90"> %</label>
      <label class="line"><span data-i18n="options_auto_min"></span>
        <input id="auto-min" type="number" min="2" max="20"></label>
    </section>

    <section class="card">
      <h2 data-i18n="options_watches"></h2>
      <p class="hint" data-i18n="options_watches_hint"></p>
      <div id="watches"></div>
      <button id="watch-add" type="button" class="small" data-i18n="options_watch_add"></button>
    </section>

    <section class="card">
      <h2 data-i18n="options_home"></h2>
      <p class="hint" data-i18n="options_home_hint"></p>
      <label class="line"><span data-i18n="options_home_psc"></span>
        <input id="home-psc" type="text" inputmode="numeric" maxlength="6" size="7" placeholder="974 01">
        <span id="home-check" class="hint"></span></label>
      <label class="line"><span data-i18n="options_home_radius"></span>
        <input id="home-radius" type="number" min="1" max="300"> km</label>
    </section>

    <section class="card">
      <h2 data-i18n="options_reader"></h2>
      <p class="hint" data-i18n="options_reader_hint"></p>
      <label class="line"><input id="reader-enabled" type="checkbox"> <span data-i18n="options_reader_enabled"></span></label>
      <label class="line"><span data-i18n="options_reader_pages"></span>
        <input id="reader-pages" type="number" min="1" max="20"></label>
      <label class="line"><span data-i18n="options_reader_every"></span>
        <select id="reader-every">
          <option value="60">1 h</option><option value="120">2 h</option><option value="180">3 h</option>
          <option value="360">6 h</option><option value="720">12 h</option><option value="1440">24 h</option>
        </select></label>
      <p class="hint" id="reader-sections"></p>
    </section>

    <section class="card">
      <h2 data-i18n="options_products"></h2>
      <p class="hint" data-i18n="options_products_hint"></p>
      <textarea id="products" rows="4" data-i18n-placeholder="options_products_placeholder"></textarea>
      <label class="line"><span data-i18n="options_threshold"></span>
        <input id="threshold" type="number" min="1" max="90"> %</label>
    </section>

    <section class="card">
      <h2 data-i18n="options_page"></h2>
      <p class="hint" data-i18n="options_page_hint"></p>
      <label class="line"><span data-i18n="options_highlight"></span>
        <input id="highlight" type="number" min="1" max="69"> %</label>
    </section>

    <div class="actions">
      <button id="save" class="primary" type="button" data-i18n="options_save"></button>
      <span id="status" role="status"></span>
    </div>

    <section class="card">
      <h2 data-i18n="options_history"></h2>
      <p class="hint" id="history-count"></p>
      <p class="hint" data-i18n="options_history_hint"></p>
      <button id="reset-history" class="danger" type="button" data-i18n="options_history_reset"></button>
    </section>

    <section class="card">
      <h2 data-i18n="options_backup"></h2>
      <p class="hint" data-i18n="options_backup_hint"></p>
      <div class="buttons">
        <button id="export" type="button" data-i18n="options_export"></button>
        <!-- Firefox closes a toolbar popup when a file picker opens, so in the
             popup this opens the same page in a tab, where the picker works. -->
        <button id="import" type="button" data-i18n="options_import"></button>
        <input id="import-file" type="file" accept=".json,application/json" hidden>
      </div>
      <p class="hint" id="backup-status" role="status"></p>
    </section>

    <footer class="hint">
      <span id="version"></span> ·
      <a href="https://github.com/lgubala/BazosRider" target="_blank" rel="noopener">GitHub</a> ·
      <span data-i18n="options_not_affiliated"></span>
    </footer>
  </div>

  <script src="../core/namespace.js"></script>
  <script src="../core/config.js"></script>
  <script src="../core/i18n.js"></script>
  <script src="../core/text.js"></script>
  <script src="../core/categories.js"></script>
  <script src="../core/parse.js"></script>
  <script src="../core/settings.js"></script>
  <script src="../core/storage.js"></script>
  <script src="../core/filters.js"></script>
  <script src="../core/skips.js"></script>
  <script src="../core/history.js"></script>
  <script src="../core/products.js"></script>
  <script src="../core/groups.js"></script>
  <script src="../core/context.js"></script>
  <script src="../core/deals.js"></script>
  <script src="../core/watches.js"></script>
  <script src="../core/badges.js"></script>
  <script src="../core/lists.js"></script>
  <script src="../filters/category.js"></script>
  <script src="../filters/keyword.js"></script>
  <script src="../skip/broken.js"></script>
  <script src="../skip/installment.js"></script>
  <script src="../skip/wanted.js"></script>
  <script src="../badges/drop.js"></script>
  <script src="../badges/free.js"></script>
  <script src="../badges/group-deal.js"></script>
  <script src="../badges/product-deal.js"></script>
  <script src="../badges/skipped.js"></script>
  <script src="../lists/cheapest.js"></script>
  <script src="../lists/deals.js"></script>
  <script src="../lists/free.js"></script>
  <script src="../lists/products.js"></script>
  <script src="../lists/watches.js"></script>
  <script src="../geo/data.js"></script>
  <script src="../geo/geo.js"></script>
  <script src="../ui/dom.js"></script>
  <script src="../core/backup.js"></script>
  <script src="../popup/rows.js"></script>
  <script src="../popup/settings.js"></script>
  <script src="../popup/popup.js"></script>
</body>
</html>
